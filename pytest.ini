[pytest]
; 配置放在仓库根，而不是 backend/ 下。
;
; 原因：pytest 的 rootdir 是从「命令行传入的参数」向上找配置文件决定的。
; 配置若只放在 backend/pytest.ini，那么从仓库根直接跑 `pytest`（不带路径）时
; 这个文件不会被加载，asyncio_mode 丢失 → 异步 fixture 不被支持 →
; 所有用例报 "requested an async fixture ... with no plugin or hook"，看起来像代码坏了。
; 放在根目录后，无论从哪个目录、带不带路径跑，行为都一致。
;
; 跑法：cd backend && python -m pytest    或    python -m pytest（仓库根）

testpaths = backend/tests
; 让 `import app` 可用，不依赖调用时的工作目录
pythonpath = backend
; pytest-asyncio：异步用例/夹具自动识别，无需逐个加 @pytest.mark.asyncio
asyncio_mode = auto
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
; 明确排除不该被扫描的目录（默认已覆盖大部分，这里写出来防止误扫）
norecursedirs = node_modules .venv .git dist dist-single release .idea .workbuddy __pycache__
