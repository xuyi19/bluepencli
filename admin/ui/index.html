<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>蓝笔申论 · 题库管理员端</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>蓝笔申论 · 题库管理员端</h1>
    <span class="tag">作者专用 · 永不随软件分发</span>
  </header>

  <section class="root-bar">
    <label>仓库根</label>
    <input id="root" type="text" placeholder="自动探测中…" spellcheck="false" />
    <button id="btn-detect">重新探测</button>
    <button id="btn-save-root" title="保存到 exe 同级 admin-config.json">保存</button>
  </section>

  <main>
    <!-- 常用参数：只有需要的工具才会用到。双列网格，卷 id 独占一行 -->
    <fieldset class="params">
      <legend>参数（按需填写）</legend>
      <div class="rows">
        <div class="row">
          <label>收件人</label>
          <input id="pack-user" type="text" placeholder="姓名&lt;邮箱&gt;（打包用）" />
        </div>
        <div class="row">
          <label>年份</label>
          <input id="year-from" type="number" placeholder="2022" min="2000" max="2100" />
          <span>—</span>
          <input id="year-to" type="number" placeholder="2024" min="2000" max="2100" />
        </div>
        <div class="row">
          <label>包文件</label>
          <input id="verify-file" type="text" placeholder="私有题库/xxx.bpq（验包用）" spellcheck="false" />
        </div>
        <div class="row">
          <label>口令</label>
          <input id="pass" type="password" placeholder="打包/验包用 · 只走环境变量" autocomplete="new-password" />
        </div>
        <div class="row wide">
          <label>卷 id</label>
          <input id="exam-ids" type="text" placeholder="2024-hebei-a 2023-hebei-a（留空=全量）" spellcheck="false" />
          <label class="chk-row" title="生成汇编 / 打包时是否包含私有卷（≥2022）">
            <input id="with-private" type="checkbox" />
            含私有卷
          </label>
        </div>
      </div>
    </fieldset>

    <div id="tools"></div>
  </main>

  <section class="console-wrap">
    <div class="console-head">
      <span>输出</span>
      <button id="btn-clear">清空</button>
    </div>
    <pre id="console" aria-live="polite">（等待操作）</pre>
  </section>

  <footer>
    <span id="status">就绪</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
