[package]
name = "bluepencil-admin"
version = "0.18.0"
description = "蓝笔申论 · 题库管理员端（作者专用，不随软件分发）"
authors = ["许一 <xuconghui_03@qq.com>"]
license = "AGPL-3.0"
repository = "https://github.com/xuyi19/bluepencli"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "bluepencil-admin"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# 管理员端只做一件事：spawn node 脚本并回显输出。
# 桌面版里的 axum/reqwest/rusqlite 一概不要 —— 少一个依赖少一分钟编译，
# 而且管理功能（私钥/口令）与分发产物物理隔离，永不进主程序。
tauri = { version = "2.11.6", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
