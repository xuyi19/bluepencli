<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="许一" />
    <meta name="email" content="xuconghui_03@qq.com" />
    <meta name="description" content="蓝笔申论 BluePencil —— 本地优先、五位老师圆桌阅卷的公考申论 AI 批改工具。作者 许一。" />
    <meta name="keywords" content="申论,公考,国考,AI批改,BluePencil,蓝笔申论" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%236d5dfc' d='M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蓝笔申论 · 三师圆桌阅卷</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>

    <!--
      版本自检：页面加载后问一次本地服务的版本号，不一致就自己刷新一次。

      为什么需要它：桌面版每次启动都开同一个地址，浏览器很可能直接复用那个
      早就打开的标签页 —— 页面里的代码可能还是好几版之前的，新功能点了没反应，
      而"换新版"看起来毫无作用，因为那个页面根本收不到修复。
      （实测遇到过 v0.8.1 留下的标签页。）

      几条约束：
        · 按**服务端版本号**记账，同一个版本只刷一次，不会停不下来；
        · 只在拿得到 /api/v1/health 时判断 —— 单文件版是 file:// 打开的，
          没有后端，fetch 直接失败并静默跳过；
        · 用相对地址请求（没有前导斜杠），这样部署在子路径下也对。
    -->
    <script>
      (function () {
        var meta = document.querySelector('meta[name="app-version"]')
        var mine = meta && meta.getAttribute('content')
        if (!mine || location.protocol === 'file:') return
        fetch('api/v1/health', { cache: 'no-store' })
          .then(function (r) { return r.json() })
          .then(function (d) {
            var theirs = d && d.version
            if (!theirs || theirs === mine) return
            var KEY = 'bp:version-reloaded'
            try {
              if (sessionStorage.getItem(KEY) === theirs) return
              sessionStorage.setItem(KEY, theirs)
            } catch (e) { /* 隐私模式：存不下就只刷这一次 */ }
            console.info('[蓝笔] 页面是 v' + mine + '，服务已是 v' + theirs + '，正在刷新…')
            location.reload()
          })
          .catch(function () { /* 没有后端（单文件版 / 浏览器直连）就跳过 */ })
      })()
    </script>
  </body>
</html>
