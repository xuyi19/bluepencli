<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7dff"/>
      <stop offset="1" stop-color="#4534c9"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe2ff"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#bg)"/>

  <!-- 一张纸（右下角露出一角，暗示"卷面"） -->
  <g transform="rotate(-8 128 128)">
    <rect x="58" y="62" width="118" height="140" rx="12" fill="#ffffff" opacity="0.22"/>
    <rect x="76" y="92" width="80" height="9" rx="4.5" fill="#ffffff" opacity="0.55"/>
    <rect x="76" y="116" width="62" height="9" rx="4.5" fill="#ffffff" opacity="0.55"/>
    <rect x="76" y="140" width="74" height="9" rx="4.5" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- 批改用的蓝铅笔，斜跨其上 -->
  <g transform="rotate(42 128 128)">
    <rect x="110" y="46" width="36" height="118" rx="7" fill="url(#body)"/>
    <rect x="110" y="70" width="36" height="7" fill="#b9b3e8"/>
    <path d="M110 164 L146 164 L128 202 Z" fill="#ffd08a"/>
    <path d="M118.5 186 L128 202 L137.5 186 Z" fill="#39324f"/>
    <rect x="107" y="30" width="42" height="18" rx="7" fill="#cfc7ff"/>
  </g>

  <!-- 红色批改勾，点出"阅卷"这件事 -->
  <path d="M158 176 L172 191 L204 152"
        fill="none" stroke="#ff5f6d" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
